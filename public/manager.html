<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>📦 Manual Stock Take by HHD</h1>
    <div>Manager Panel</div>
</header>

<div class="dashboard">

<div class="card">
<h3>Total WSN</h3>
<h2 id="totalWSN">250000</h2>
</div>

<div class="card">
<h3>Assigned</h3>
<h2 id="assignedWSN">0</h2>
</div>

<div class="card">
<h3>Pending</h3>
<h2 id="pendingWSN">0</h2>
</div>

<div class="card">
<h3>Completed</h3>
<h2 id="completedWSN">0</h2>
</div>

</div>

<div class="container">

<h2>Assign Work</h2>

<label>Select Employee</label>

<select id="employeeList">
<option>Select Employee</option>
</select>

<input
type="text"
id="wsn"
placeholder="Scan or Enter WSN">

<div class="btn-group">

<button onclick="assignWSN()">
Assign WSN
</button>

<button>
Send To HHD
</button>

<button>
Upload Excel
</button>

<button onclick="loadEmployees()">
Refresh
</button>

</div>

<h3>Assigned WSN</h3>

<table>

<thead>

<tr>

<th>WSN</th>

<th>Status</th>

<th>Employee</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</body>
</html>
